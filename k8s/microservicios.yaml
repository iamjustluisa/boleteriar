apiVersion: apps/v1
kind: Deployment
metadata:
  name: usuarios
  labels: {app.kubernetes.io/name: usuarios, app.kubernetes.io/part-of: boleteria}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: usuarios}
  template:
    metadata:
      labels: {app.kubernetes.io/name: usuarios, app.kubernetes.io/part-of: boleteria}
    spec:
      containers:
        - name: usuarios
          image: boleteria-app:1.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: SERVICIO, value: usuarios}
            - {name: PORT, value: "8000"}
          envFrom:
            - configMapRef: {name: boleteria-config}
            - secretRef: {name: boleteria-secretos}
          ports:
            - {containerPort: 8000, name: http}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: usuarios
  labels: {app.kubernetes.io/name: usuarios, app.kubernetes.io/part-of: boleteria}
spec:
  selector: {app.kubernetes.io/name: usuarios}
  ports:
    - {name: http, port: 8000, targetPort: http}
