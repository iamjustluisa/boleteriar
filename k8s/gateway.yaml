# Generado por k8s/generar.py: API Gateway (2 réplicas), acceso por NodePort 30080 y autoescalado.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: {app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: boleteria}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: gateway}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: boleteria}
    spec:
      containers:
        - name: gateway
          image: boleteria-app:1.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: SERVICIO, value: gateway}
            - {name: PORT, value: "8000"}
            - {name: SEED_AL_INICIAR, value: "true"}
          envFrom:
            - configMapRef: {name: boleteria-config}
            - secretRef: {name: boleteria-secretos}
          ports:
            - {containerPort: 8000, name: http}
          readinessProbe:
            httpGet: {path: /api/estado, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels: {app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: boleteria}
spec:
  selector: {app.kubernetes.io/name: gateway}
  ports:
    - {name: http, port: 8000, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-publico
  labels: {app.kubernetes.io/part-of: boleteria}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: gateway}
  ports:
    - {name: http, port: 80, targetPort: http, nodePort: 30080}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: gateway}
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
