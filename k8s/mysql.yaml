# MySQL 8 con almacenamiento persistente. Los scripts de database/ se cargan desde el ConfigMap
# mysql-initdb (ver README.md) la primera vez que arranca el volumen.
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels: {app.kubernetes.io/name: mysql, app.kubernetes.io/part-of: boleteria}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: mysql}
  ports:
    - {name: mysql, port: 3306}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  labels: {app.kubernetes.io/name: mysql, app.kubernetes.io/part-of: boleteria}
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mysql}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mysql, app.kubernetes.io/part-of: boleteria}
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          args: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: boleteria-secretos, key: MYSQL_ROOT_PASSWORD}}
            - {name: MYSQL_USER, value: boleteria}
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: boleteria-secretos, key: MYSQL_PASSWORD}}
          ports:
            - {containerPort: 3306, name: mysql}
          readinessProbe:
            exec: {command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD --silent"]}
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: datos, mountPath: /var/lib/mysql}
            - {name: initdb, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: initdb
          configMap: {name: mysql-initdb}
  volumeClaimTemplates:
    - metadata:
        name: datos
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 5Gi}
